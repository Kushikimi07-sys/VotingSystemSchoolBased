<!DOCTYPE html>
<html>
<head>
  <title>Login</title>

  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./login.css">
</head>

<body>

<div class="login-page">

  <div class="login-wrapper">

    <!-- LEFT SIDE -->
    <div class="welcome-side">

      <h1>Welcome!</h1>

      <p>
        This system is designed to provide a simple,
        secure, and accurate voting experience for all users.
      </p>

    </div>

    <!-- RIGHT SIDE -->
    <div class="form-side">

      <!-- LOGIN -->
      <div id="loginBox">

        <h2>Log In</h2>

        <div class="form-box">

          <!-- REMOVED ROLE -->

          <label>Username</label>

          <input id="username"
                 placeholder="Enter username">

          <label>Password</label>

          <input id="password"
                 type="password"
                 placeholder="Enter password">

          <button onclick="login()">
            LOGIN
          </button>

          <p class="switch-text"
             onclick="toggleRegister()">

             Don't have account?
             <span>Register</span>

          </p>

        </div>

      </div>

      <!-- REGISTER -->
      <div id="registerBox" style="display:none;">

        <h2>Create Account</h2>

        <div class="form-box">

          <label>Username</label>

          <input id="regUsername"
                 placeholder="Enter username">

          <label>Password</label>

          <input id="regPassword"
                 type="password"
                 placeholder="Enter password">

          <!-- KEEP ROLE FOR REGISTER -->
          <label>Role</label>

          <select id="regRole">
            <option value="voter">Voter</option>
            <option value="admin">Admin</option>
          </select>

          <button onclick="register()">
            CREATE ACCOUNT
          </button>

          <p class="switch-text"
             onclick="toggleRegister()">

             Already have account?
             <span>Login</span>

          </p>

        </div>

      </div>

    </div>

  </div>

</div>

<script src="./app.js"></script>

</body>
</html>
