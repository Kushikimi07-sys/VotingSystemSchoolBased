<!DOCTYPE html>
<html>
<head>

  <title>Voter Panel</title>

  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./voter.css">

</head>

<body>

<div class="layout">

  <!-- SIDEBAR -->
  <div class="sidebar">

    <div>

      <h1 class="logo">VOTER</h1>

      <div class="menu">

        <button class="nav active">
          🗳 Cast Vote
        </button>

      </div>

    </div>

    <!-- LOGOUT -->
    <button onclick="logout()"
            class="logout-btn">

      Logout

    </button>

  </div>

  <!-- MAIN -->
  <div class="main">

    <div class="topbar">

      <h2>Election Ballot</h2>

    </div>

    <!-- HERE MAG DISPLAY -->
    <div id="voteBox"
         class="vote-grid">

    </div>

    <!-- SUBMIT -->
    <div class="submit-area">

      <button class="submit-btn"
              onclick="submitVotes()">

        Submit Vote

      </button>

    </div>

  </div>

</div>

<script src="./app.js"></script>

<script>
  voterInit();
</script>

</body>
</html>
